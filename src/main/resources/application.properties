# Server
server.port=${PORT:8080}

# H2 file-based database -> data survives app restarts/redeploys on the same disk.
# Switch to Postgres/MySQL in production by changing these 4 lines + the driver dependency.
spring.datasource.url=jdbc:h2:file:./data/notesdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Optional H2 web console for local debugging: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Serve the frontend (index.html/style.css/script.js) directly from src/main/resources/static
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# File attachments (PDF, Word, Excel, images, audio, ...)
app.upload-dir=./uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Set this to enable full, live AI answers (summarize/rewrite/ask/etc). If unset,
# the AI Assistant and Ask My Notes features run on built-in offline heuristics.
# ANTHROPIC_API_KEY=
